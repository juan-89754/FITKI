name: fitki
description: Fitki - Aplicación de finanzas personales
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3
  path: ^1.9.0
  intl: ^0.19.0
  fl_chart: ^0.70.0
  go_router: ^17.5.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.1.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  file_picker: ^13.0.0
  local_auth: ^2.3.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0C6E4E"
  adaptive_icon_foreground: "assets/icon/icon.png"
